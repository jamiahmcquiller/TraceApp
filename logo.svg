<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#000000" rx="20"/>
  <!-- Outer dashed radar ring -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="#B7E445" stroke-width="7" stroke-dasharray="10 8" stroke-linecap="round"/>
  <!-- Inner solid ring -->
  <circle cx="100" cy="100" r="48" fill="none" stroke="#B7E445" stroke-width="3" opacity="0.7"/>
  <!-- Center dot -->
  <circle cx="100" cy="100" r="6" fill="#B7E445"/>
  <!-- Radar sweep line -->
  <line x1="100" y1="100" x2="100" y2="28" stroke="#B7E445" stroke-width="4" stroke-linecap="round"/>
  <!-- Small ticks for radar style -->
  <line x1="100" y1="22" x2="100" y2="32" stroke="#B7E445" stroke-width="3"/>
  <line x1="168" y1="100" x2="178" y2="100" stroke="#B7E445" stroke-width="3"/>
  <line x1="22" y1="100" x2="32" y2="100" stroke="#B7E445" stroke-width="3"/>
  <line x1="100" y1="168" x2="100" y2="178" stroke="#B7E445" stroke-width="3"/>
</svg>
